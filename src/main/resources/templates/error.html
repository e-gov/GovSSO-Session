<!DOCTYPE html>
<html layout:decorate="~{layout}" th:lang="${#locale.language}" th:with="hideHeaderLanguageSelection=true"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head}"></head>
<body>
<div layout:fragment="content" th:remove="tag" th:with="hideHeaderLanguageSelection=true">
    <div class="container">
        <div class="alert alert-error" role="alert">
            <p><strong><span th:remove="tag" th:text="#{message.error.auth.title}"></span></strong></p>
            <p th:if="${message != null}" th:utext="${message}"></p>
            <p th:text="#{error.technical_general}" th:unless="${message != null}"></p>
            <th:block th:if="${incident_nr != null}">
                <span th:text="#{label.error.incident-time('')}"></span>
                <span id="incident-time"
                   th:attr="data-server-time=${offset_timestamp},data-time-format=#{format.datetime}"></span>
                <p th:text="#{label.error.incident-number(${incident_nr})}"></p>
                <script th:src="@{/scripts/timeconverter.js}"></script>
            </th:block>
        </div>
    </div>
</div>
</body>
</html>
